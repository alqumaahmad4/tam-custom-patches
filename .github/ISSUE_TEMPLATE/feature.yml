name: Feature
description: Track implementation work with acceptance criteria.
title: "[M1] "
labels: ["type: feature", "milestone: foundation"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be built and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: List independently verifiable criteria.
      value: |
        - [ ]
    validations:
      required: true
  - type: input
    id: dependencies
    attributes:
      label: Dependencies
      description: Link any blocking issues.
  - type: dropdown
    id: effort
    attributes:
      label: Effort
      options:
        - XS
        - S
        - M
        - L
        - XL
    validations:
      required: true
